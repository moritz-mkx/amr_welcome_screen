# Apache-Vhost fuer den Welcome-Screen (PHP-Version)
#
# Ablage:  /etc/apache2/sites-available/welcome-screen.conf
# Aktivieren:  sudo a2dissite 000-default.conf && sudo a2ensite welcome-screen.conf
#              sudo systemctl reload apache2
#
# Voraussetzung: /var/www/welcome-screen ist ein Symlink (oder Mountpunkt)
# auf das Projekt-Repo. setup-apache.sh erledigt das automatisch.

<VirtualHost *:80>
    ServerName welcome-screen.local
    DocumentRoot /var/www/welcome-screen/public

    <Directory /var/www/welcome-screen/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Mediendateien: kein PHP-Executor in diesem Verzeichnis (siehe .htaccess)
    <Directory /var/www/welcome-screen/public/media>
        Options -Indexes -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-Limits passend zu den frueheren Multer-Limits.
    # Groesste erlaubte Datei: 500 MB (Videos). post_max_size > upload_max_filesize.
    php_value upload_max_filesize 510M
    php_value post_max_size 520M
    php_value max_execution_time 300
    php_value max_input_time 300
    php_value memory_limit 512M

    ErrorLog ${APACHE_LOG_DIR}/welcome-screen-error.log
    CustomLog ${APACHE_LOG_DIR}/welcome-screen-access.log combined
</VirtualHost>
